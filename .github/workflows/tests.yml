name: Tests

on:
  push:
    branches: [main, v2, issue-6-v2]
  pull_request:
    branches: [main, v2, issue-6-v2]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -q
