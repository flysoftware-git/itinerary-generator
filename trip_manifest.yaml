# ============================================================
# Southwest Road Trip — Trip Manifest
# Reverse-engineered from itinerary v2.5 for generator testing
# ============================================================
#
# SCHEMA NOTES (v0.4):
#   - google_maps_link: AUTO-GENERATED from ordered destinations
#   - lat/lng:          AUTO-RESOLVED via Nominatim geocoding
#   - nps_park_code:    AUTO-DETECTED from destination name
#   - weather_url:      AUTO-CONSTRUCTED from lat/lng
#   - scenic drives:    FULLY AI-DISCOVERED — not seeded here
#   - cultural events:  FULLY AI-DISCOVERED via Bing Search
#   - seeds:            Attraction/hike/experience name hints only
#                       (things the traveler specifically intends to include)
#
# PLANNING LINKS: Replace placeholder URLs with your actual
#                 Notion, TripIt, or reservation links.
#
# BOOKINGS:       `lodging.confirmation_number`/`lodging.website` and the
#                 `transportation` list (plane/train/car/other) render as
#                 collapsed detail cards on the destination. All of it is
#                 redacted out of privacy-redacted builds -- prod by
#                 default -- so a published copy carries none of it while
#                 a dev build you hand to a travel companion carries all
#                 of it with no login. See docs/design/
#                 reservation-email-ingestion.md for filling these from
#                 forwarded confirmation emails instead of by hand.
#                 Every confirmation number below is a made-up example.
# ============================================================

trip:
  title: "Southwest Road Trip"
  subtitle: "October 2026 — Utah, Colorado & New Mexico"
  theme_color: "#C0623E"        # terracotta — nav, headers, map markers

destinations:

  # ── 1. ZION NATIONAL PARK ─────────────────────────────────
  - id: zion
    name: "Zion National Park"
    dates: "October 7–9, 2026"
    # Booking details. `name`, `website` and `confirmation_number` are all
    # blanked in privacy-redacted builds (prod by default) -- a link to the
    # property's own site identifies it just as precisely as its name, and a
    # confirmation code plus a surname is often enough to change or cancel
    # someone else's stay. `location` and `checkin_time` are deliberately NOT
    # redacted: they drive geocoding/routing and arrival-day scheduling, so
    # they are load-bearing well beyond display.
    lodging:
      name: "Zion Lodge"
      location: "Zion Lodge, Springdale, UT"
      checkin_time: "4:00 PM"
      confirmation_number: "ZL-4471902"        # EXAMPLE VALUE -- not a real booking
      website: "https://www.zionlodge.com/"

    # Booked travel legs ARRIVING at this destination -- the flight, train or
    # rental that gets you here. This mirrors en_route_seeds, which attaches
    # the inbound drive to the arriving destination rather than the departing
    # one. A rental car held across several stops belongs on the destination
    # where it is picked up, as below.
    #
    # type: plane | train | car | other. Every field is cleared entirely in
    # privacy-redacted builds -- unlike lodging there is no routing consumer
    # to keep alive, and carrier + record locator is enough to view or change
    # a booking.
    transportation:
      - type: plane
        provider: "United Airlines"
        label: "UA 1234 SFO→LAS"
        confirmation_number: "XR7Q2M"          # EXAMPLE VALUE -- not a real booking
        depart: "SFO 8:15 AM, October 7"
        arrive: "LAS 10:05 AM, October 7"
        website: "https://www.united.com/"
      - type: car
        provider: "Hertz"
        label: "Midsize SUV"
        confirmation_number: "H99120445"       # EXAMPLE VALUE -- not a real booking
        depart: "Picked up LAS, October 7"
        arrive: "Returned LAS, October 19"
        website: "https://www.hertz.com/"

    planning_links:
      - label: "Zion Trip Notes"
        url: "https://www.notion.so/"
      - label: "Zion Lodge Reservation"
        url: "https://www.zionlodge.com/"

    seeds:
      - "Angels Landing"
      - "The Narrows"
      - "Emerald Pools Trail"
      - "Canyon Overlook Trail"
      - "Weeping Rock"
      - "Kolob Canyons"

  # ── 2. BRYCE CANYON NATIONAL PARK ────────────────────────
  - id: bryce
    name: "Bryce Canyon National Park"
    dates: "October 9–11, 2026"
    lodging:
      name: "Bryce Canyon Lodge"
      location: "Bryce Canyon Lodge, Bryce, UT"
      checkin_time: "4:00 PM"

    planning_links:
      - label: "Bryce Trip Notes"
        url: "https://www.notion.so/"
      - label: "Bryce Canyon Lodge"
        url: "https://www.brycecanyonforever.com/lodging/bryce-canyon-lodge/"

    seeds:
      - "Navajo Loop Trail"
      - "Queens Garden Trail"
      - "Sunrise Point"
      - "Bryce Point"
      - "Dark Sky Stargazing"
      - "Fairyland Loop"

  # ── 3. CAPITOL REEF NATIONAL PARK ────────────────────────
  - id: capitolreef
    name: "Capitol Reef National Park"
    dates: "October 11–13, 2026"
    lodging:
