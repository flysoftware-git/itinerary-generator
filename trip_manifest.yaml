      location: "Capitol Reef Resort, Torrey, UT"
      checkin_time: "4:00 PM"

    planning_links:
      - label: "Capitol Reef Trip Notes"
        url: "https://www.notion.so/"

    seeds:
      - "Hickman Bridge"
      - "Grand Wash Trail"
      - "Cassidy Arch"
      - "Fremont Petroglyphs"
      - "Fruita Historic District"
      - "Gifford Homestead"

  # ── 4. MOAB ───────────────────────────────────────────────
  - id: moab
    name: "Moab"
    dates: "October 13–15, 2026"
    lodging:
      name: "Moab Valley Inn"
      location: "Moab Valley Inn, Moab, UT"
      checkin_time: "4:00 PM"

    planning_links:
      - label: "Moab Trip Notes"
        url: "https://www.notion.so/"
      - label: "Arches Timed Entry"
        url: "https://www.recreation.gov/timed-entry/10086910"

    seeds:
      - "Delicate Arch"
      - "Landscape Arch"
      - "Island in the Sky"
      - "Mesa Arch"
      - "Dead Horse Point State Park"
      - "Corona Arch Trail"

  # ── 5. TELLURIDE ──────────────────────────────────────────
  - id: telluride
    name: "Telluride"
    dates: "October 15–17, 2026"
    lodging:
      name: "Telluride Lodging"
      location: "Madeline Hotel, Telluride, CO"
      checkin_time: "4:00 PM"

    # `train` example. A leg needs only `type`; everything else is optional,
    # so a reservation whose email parsed incompletely still renders with
    # whatever details did come through rather than being dropped. An
    # unrecognized type falls back to the "other" category.
    transportation:
      - type: train
        provider: "Amtrak"
        label: "California Zephyr"
        confirmation_number: "AMT-889301"      # EXAMPLE VALUE -- not a real booking
        depart: "Grand Junction, CO 10:42 AM"
        arrive: "Denver, CO 6:38 PM"

    planning_links:
      - label: "Telluride Trip Notes"
        url: "https://www.notion.so/"
      - label: "Lodging"
        url: "https://www.telluride.com/lodging/"

    seeds:
      - "Bridal Veil Falls"
      - "Bear Creek Trail"
      - "Jud Wiebe Trail"
      - "Free Gondola to Mountain Village"
      - "Historic Main Street"

