# Itinerary Generator — Configuration
# Version: 1.2.0
# All secrets come from environment variables. Never store keys here.

# ── Template ─────────────────────────────────────────────────────────────────
template:
  path: "templates/v2.5_template.html"
  checksum_path: "templates/checksums.txt"
  version: "2.5"
  verify_checksum: true

# ── Azure OpenAI ─────────────────────────────────────────────────────────────
ai:
  # Supported providers: openai | anthropic | deepseek | gemini | grok
  # Legacy compatibility: azure_openai
  provider: "grok"
  model: "grok-latest"
  temperature: 0.7
  max_tokens: 4096
  max_concurrent_destinations: 4
  grok_max_concurrent_destinations: 1
  enable_url_candidate_experiment: false
  # Optional content-generation failover: when the primary provider's circuit
  # breaker opens (repeated transient errors -- see llm_client.py), calls are
  # transparently routed to this fallback provider/model instead of failing.
  # Requires the fallback provider's own API key to be present in the
  # environment (checked eagerly at startup, same as the primary). Leave
  # unset (or comment out) to disable -- the default, unchanged behavior.
  # Note: this only covers content-generation calls (llm_client.py). It does
  # NOT cover search/harvest calls (grok_search.py), which have no
  # alternative-provider implementation.
  # fallback_provider: "openai"
  # fallback_model: "gpt-4o-mini"

# ── Azure OpenAI (legacy compatibility) ──────────────────────────────────────
azure_openai:
  # Keys read from env: AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY,
  #                     AZURE_OPENAI_DEPLOYMENT, AZURE_OPENAI_API_VERSION
  temperature: 0.7
  max_tokens: 4096
  retry_attempts: 3
  retry_backoff_seconds: 2

# ── xAI Grok Semantic Search ───────────────────────────────────────────
# Replaces: Google Programmable Search Engine (v1.4, rate-limited, prohibitive costs)
# Docs:     https://docs.x.ai/
# API:      https://api.x.ai/v1/chat/completions
# Key read from env: XAI_API_KEY
grok_search:
  endpoint: "https://api.x.ai/v1/chat/completions"
  model: "grok-latest"
  timeout_seconds: 15

# ── NPS API ──────────────────────────────────────────────────────────────────
nps:
  # Key read from env: NPS_API_KEY — falls back to "DEMO_KEY" if unset
  # Free key: https://www.nps.gov/subjects/developer/get-started.htm
  endpoint: "https://developer.nps.gov/api/v1"
  image_count: 3

# ── Wikimedia Commons ─────────────────────────────────────────────────────────
wikimedia:
  thumb_width: 960
  api_endpoint: "https://commons.wikimedia.org/w/api.php"

# ── Image acquisition ─────────────────────────────────────────────────────────
images:
  provider_priority: ["nps", "unsplash", "wikimedia"]
  per_destination: 3
  min_per_destination: 2
  max_per_destination: 4
  never_content_terms:
    - "underwater"
    - "scuba"
    - "snorkel"
    - "snorkeling"
  cache_ttl_hours: 168
  max_fallback_attempts: 4

# ── Content-quality gate ─────────────────────────────────────────────────────
# Promoted 2026-08-15 from main.py's _run_quality_gate, which only ever
# printed these to the console -- never persisted to validation_report.json
# and never affected validation's pass/fail status, so a run with 12 orphan
# attraction cards (dipstick56+) still reported valid:true. These thresholds
# now produce real, persisted warnings. Kept as warnings (not errors) by
# design: orphan-card/teaser gaps are a known, currently-unresolved
# data-coverage issue (see docs/reports/dipstick55_bug_triage.md, Theme
# C/D residuals) -- hard-failing on the CURRENT baseline would block every
# run until that's separately fixed. Duplicate-URL detection is a genuinely
# new check (not in the old quality gate) with no known false-positive risk,
# since it only flags identical URLs within the same destination.
quality_gate:
  max_no_url_attractions: 3
  max_no_url_en_route_stops: 2
  max_no_url_restaurants: 0
  max_empty_teaser_ratio: 0.15
  verify_timeout_seconds: 8
  valid_content_types:
    - "image/jpeg"
    - "image/png"
    - "image/webp"
    - "image/gif"

# ── URL verification ──────────────────────────────────────────────────────────
url_verification:
  timeout_seconds: 10
  user_agent: "RoadTripItineraryGenerator/1.0"
  max_redirects: 5
  head_only: true

# ── Link type taxonomy ────────────────────────────────────────────────────────
# URL discovery runs TWO passes for restaurants:
#   Pass 1: google.com/maps  (top-rated, well-documented)
#   Pass 2: tripadvisor.com  (local favorites, cuisine diversity)
link_types:

  hike:
    icon: "footprints"
    badge_label: "View Trail"
    badge_color: "green"
    rendering_target: "top_attractions"
    discovery_site_filter: "alltrails.com"
    nps_site_filter: true
    url_allowed: true

  scenic_drive:
    icon: "map"
    badge_label: "Scenic Drive Info"
    badge_color: "amber"
    rendering_target: "scenic_drives_popup"
    discovery_site_filter: null
    url_allowed: false

  attraction:
    icon: "landmark"
    badge_label: "Learn More"
    badge_color: "blue"
    rendering_target: "top_attractions"
    discovery_site_filter: null
    nps_site_filter: true
    url_allowed: true

  viewpoint:
    icon: "eye"
    badge_label: "View Point"
    badge_color: "sky"
    rendering_target: "top_attractions"
    discovery_site_filter: null
    url_allowed: true

  restaurant:
    icon: "utensils"
    badge_label: "View on Maps"
    badge_color: "rose"
    rendering_target: "dinner_recommendations"
    discovery_passes:
      - site_filter: "google.com/maps"
      - site_filter: "tripadvisor.com"
    url_allowed: true

  planning:
    icon: "calendar"
    badge_label: null
    badge_color: "purple"
    rendering_target: "header"
    discovery_site_filter: null
    url_allowed: true

# ── Geocoding ─────────────────────────────────────────────────────────────────
geocoding:
  provider: "nominatim"
  user_agent: "RoadTripItineraryGenerator/1.0"
  timeout_seconds: 5
  retry_attempts: 2
  rate_limit_seconds: 1.1

# ── Cultural events discovery ─────────────────────────────────────────────────
cultural_events:
  primary_query_template: "{destination} events {month} {year}"
  secondary_query_template: "{destination} festivals concerts cultural {month} {year}"
  max_results: 8
  target_events_per_destination: 3
  verify_event_urls: true
  # Which search/harvest provider backs this module's real web search:
  # grok or claude. This module is entirely non-batch (one per-destination
  # query, see generator/cultural_events.py's discover()). Was claude
  # (2026-08-14 probe evidence put it close behind Grok on citation fidelity,
  # 93% vs 100%, for this shape of call) -- reverted to grok 2026-08-15: a
  # same-shape real-run comparison found Claude costing ~4.6x Grok for
  # equivalent output, and the account is no longer being funded, so citation
  # fidelity being marginally better is moot if the provider can't be relied
  # on to have credit. Independent of ai.provider (content generation) and of
  # url_discovery.search_provider/nonbatch_search_provider below -- each
  # search call site picks its own. See generator/search_provider.py,
  # generator/claude_search.py, docs/design/search-provider-capability-probe.md.
  search_provider: "grok"

# ── URL discovery ─────────────────────────────────────────────────────────────
url_discovery:
  # Two independent search-provider knobs for two different clients this
  # module builds (see generator/url_discovery.py's __init__):
  #   search_provider           -- the direct-batch HTML harvest path
  #                                (_get_direct_batch_html_rows_for_destination,
  #                                self._search). This is the primary,
  #                                highest-volume path (all *_source keys
  #                                below default to direct_link_batch) and
  #                                the one with the strongest probe evidence
  #                                (100% citation fidelity) -- kept on grok.
  #   nonbatch_search_provider  -- the per-item search fallback used by
  #                                _search_cached/self._search_fallback
  #                                (e.g. _search_first_strict, gap-filling
  #                                lookups). Lower volume, same non-batch
  #                                shape as cultural_events.search_provider
  #                                above. Was claude (same citation-fidelity
  #                                evidence); reverted to grok 2026-08-15
  #                                alongside cultural_events.search_provider
  #                                -- see that comment for why. With no
  #                                working fallback provider, self._search_fallback
  #                                effectively becomes a second grok client;
  #                                harmless (still independently rate-limited/
  #                                breaker-tracked) but no longer adds
  #                                cross-provider resilience.
  search_provider: "grok"
  nonbatch_search_provider: "grok"
  # How many destinations' worth of attraction/restaurant/trail direct-batch
  # harvest requests get combined into a single call, instead of one call
  # per destination. 1 disables grouping (original behavior, safe rollback).
  # 2026-08-15 real-call evidence: 2 completed reliably (~90s, matching a
  # single destination's own latency) with correct results; 3 never
  # converged (300s+, zero output across 2 attempts). Kept at 2 pending more
  # evidence before raising further -- also overridable per-run via the
  # DIRECT_BATCH_GROUP_SIZE env var without editing this file.
  #
  # 2026-08-16 real-run evidence (dipstick58, group_size=2): of 12 attempted
  # grouped jobs (4 destination-pairs x attraction/restaurant/trail), only 1
  # had BOTH destinations' sections successfully split and matched --
  # matching (not just underperforming) the earlier dipstick55/56+
  # investigation's ~2-of-12 finding. Every other job silently fell through
  # to the normal per-destination call it exists to avoid, so the feature
  # is net overhead in practice, not net savings, and per this run's
  # hypothesis check may also be costing real URL matches (a partially
  # matched or wrongly split group could starve a destination that an
  # individual call would have resolved cleanly). No exceptions were ever
  # thrown -- the split/match failure is silent by design (see
  # _fetch_and_cache_grouped_direct_batch's fail-open comment) -- and no
  # raw failed-grouped-HTML sample survived this run to root-cause the
  # *why* with confidence (diagnostic logging was added on
  # _split_multi_destination_html / _match_destination_section failure
  # paths in generator/url_discovery.py so the next attempt captures that
  # evidence). Reverting to 1 (disabled) until a real fix lands and is
  # re-verified against a live run; DIRECT_BATCH_GROUP_SIZE env var still
  # allows opting back in for testing without editing this file.
  #
  # 2026-08-19: re-enabled at 2 to retest, now that the diagnostic logging
  # on _split_multi_destination_html / _match_destination_section failure
  # paths is in place to capture the evidence the earlier attempts lacked.
  # Two things changed since the dipstick58 revert that make this worth
  # re-running rather than a straight repeat: that logging exists, and the
  # persistent cache actually retains results between runs now (it was
  # being clobbered by every pytest run -- see the conftest.py fix), so a
  # grouped run's partial successes are no longer thrown away before the
  # next attempt can build on them.
  #
  # RETEST RESULT (2026-08-19 dev run, run_id 20260820T032249): failed again,
  # back to 1. Grouping avoided ZERO requests -- gate_a's
  # batch_work_ratio.url_discovery_search reported
  # requests_avoided_vs_naive: 0 and url_targets_per_provider_request: 0.92 --
  # while raising url_discovery_search_calls to 181, against 166-176 on the
  # four preceding group_size=1 prod runs. So it cost ~9% more calls and
  # bought nothing, reproducing dipstick58's finding rather than refuting it.
  # Two attempts, same outcome: treat this as needing a real root-cause fix in
  # _split_multi_destination_html / _match_destination_section before it is
  # worth a third run, not another config flip.
  #
  # DIRECT_BATCH_GROUP_SIZE=2 still opts back in for a single experiment
  # without editing this file.
  direct_batch_group_size: 1
  alltrails_source: direct_link_batch
  attraction_source: direct_link_batch
  restaurant_source: direct_link_batch
  en_route_source: direct_link_batch
  direct_batch_authoritative: true
  direct_link_batch_count: 20
  restaurant_direct_batch_item_count: 8
  en_route_direct_batch_item_count: 8
  restaurant_direct_batch_min_results: 4
  en_route_direct_batch_min_results: 3
  max_attempts_per_item: 4
  verify_timeout_seconds: 10
  restaurant_passes: 2
  max_trail_miles: 3
  allow_blocked_alltrails: true
  alltrails_min_confidence_for_publish: "medium"
  alltrails_request_delay_seconds: 0.8
  alltrails_block_cooldown_seconds: 8
  # Wayback Machine fallback for AllTrails trailhead geo extraction (fires
  # when the direct AllTrails fetch above is bot-blocked -- see
  # docs/design/url-discovery-and-audit.md's "AllTrails Trailhead Geo Maps
  # Link" section). Kept gentle since archive.org is a shared nonprofit
  # resource, not a target to hammer.
  wayback_request_delay_seconds: 1.0
  enable_filtered_alltrails_selection: true
  alltrails_filter_max_miles: 4
  alltrails_filter_max_gain_feet: 1000
  alltrails_filter_min_reviews: 5
  alltrails_filter_allowed_difficulties: ["easy", "moderate"]
  alltrails_explore_filters:
    within_miles: 10
    activities: ["hiking"]
    difficulties: ["easy", "moderate"]
    max_length_miles: 3.0
    max_gain_feet: 800
    min_rating: 3
  max_alltrails_query_attempts: 2
  max_restaurant_query_attempts: 1
  alltrails_rating_min: 4.5
  alltrails_rating_min_votes: 200
  alltrails_rating_boost: 8
  restaurant_rating_min: 4.4
  restaurant_rating_min_votes: 100
  restaurant_rating_boost: 6
  place_interest_min_rating: 4.0
  place_interest_min_votes: 50
  place_interest_require_metadata: false
  url_policy_mode: "enforce"
  url_policy_blocked_classes:
    - "google_search"
    - "google_maps_search"
    - "google_maps_dir"
    - "social_media"
  url_policy_allowlist_path: "docs/policy/url_policy_allowlist.txt"
  url_policy_auto_allow_from_output: false
  url_policy_output_path: "output/index.html"
  url_domain_denylist:

  alltrails_slug_denylist:
    - "ajax-peak-trail"
    - "dixie-sugarloaf-trail"
  restaurant_name_denylist: []
  max_scenic_drive_miles: 150
  uninterested_attraction_keywords:
    - "golf course"
    - "golf club"
    - " golf "
    - "country club"
    - "bike trail"
    - "bicycle trail"
    - "cycling trail"
    - "hospital"
    - "medical center"
    - "urgent care"
    - "clinic"
    - "emergency room"
    - "not a tourist attraction"
  seasonal_uninterested:
    ski:
      keywords:
        - " ski"
        - "ski "
        - "ski-"
        - "snowboard"
        - "snowboarding"
        - "chairlift"
      in_season_months: [11, 12, 1, 2, 3, 4]

# ── Multi-site destination grouping (GH #68, Option 3) ─────────────────────────
# See docs/design/multi-site-destination-grouping.md. A destination entry can
# set `group_with: <base id>` to share a lodging base with another entry
# (e.g. Arches/Canyonlands day-tripping from a Moab base). Physical
# proximity means some categories would otherwise produce duplicate content
# across grouped entries if independently discovered per entry -- this
# project-wide default defers those categories to the group's base entry.
# Valid values: trail | attraction | restaurant | en_route_stop | scenic_drive.
# Overridable per-entry via the grouped entry's own base_owned_categories
# field (an explicit empty list there opts that entry out entirely).
multi_site_grouping:
  base_owned_categories: ["restaurant", "cultural_events"]

# ── Output validation ─────────────────────────────────────────────────────────
validation:
  check_div_balance: true
  check_script_isolation: true
  check_all_links: true
  fail_on_broken_links: false
  fail_on_broken_images: true
  min_images_per_destination: 2
  report_path: "output/validation_report.json"

# ── Destination retry policy (Phase 4 selective regeneration) ───────────────
destination_retry:
  max_retries_per_destination_per_run: 1
  min_url_acceptance_ratio: 0.60
  min_accepted_by_section:
    top_attractions: 1

# ── Output ────────────────────────────────────────────────────────────────────
output:
  path: "output/index.html"
  encoding: "utf-8"
  write_validation_report: true
